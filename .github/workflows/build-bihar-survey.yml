name: Build BIHAR SURVEY NON IT APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'bihar-survey-non-it/**'
      - '.github/workflows/build-bihar-survey.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        working-directory: bihar-survey-non-it
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BIHAR-SURVEY-NON-IT-APK
          path: bihar-survey-non-it/app/build/outputs/apk/debug/app-debug.apk
