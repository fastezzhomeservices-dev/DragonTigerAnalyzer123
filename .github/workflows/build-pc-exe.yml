name: Build PC EXE + Installer
# PC build trigger refreshed after source syntax fix.
on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: pc-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify PC source syntax
        run: python -m py_compile pc_analyzer.py

      - name: Install build dependencies
        run: pip install pyinstaller openpyxl pillow pywebview

      - name: Build PC EXE
        run: pyinstaller --onedir --windowed --name DragonTigerAnalyzerPC pc_analyzer.py

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build Windows Installer
        run: iscc installer.iss

      - name: Verify packaged files
        shell: pwsh
        run: |
          if (!(Test-Path "dist\DragonTigerAnalyzerPC\DragonTigerAnalyzerPC.exe")) { throw "PC EXE missing" }
          if (!(Test-Path "installer\DragonTigerAnalyzerPC-v2.0-FINAL-Setup.exe")) { throw "Installer missing" }

      - uses: actions/upload-artifact@v4
        with:
          name: DragonTigerAnalyzer-PC-Installer-FINAL
          path: installer/DragonTigerAnalyzerPC-v2.0-FINAL-Setup.exe
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: DragonTigerAnalyzer-PC-EXE-FINAL
          path: dist/DragonTigerAnalyzerPC
          if-no-files-found: error

# Trigger PC build for actual pair-result history fix.
